<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Balance Log</title>
  <style>
    :root{--bg:#f4f8f7;--panel:#fff;--ink:#17332d;--muted:#678079;--line:#dbe7e3;--accent:#19745f;--accent2:#e0f2ec;--warn:#b44444;--shadow:0 8px 28px rgba(29,73,62,.08)}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#eff8f4,#f8f6ee);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;line-height:1.55}
    .app{max-width:920px;margin:auto;padding:20px 14px 60px}header{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin:8px 2px 22px}h1{font-size:clamp(25px,5vw,38px);margin:0;letter-spacing:-.03em}.tagline{margin:4px 0 0;color:var(--muted)}
    .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#e9f1ee;padding:5px;border-radius:16px;margin-bottom:16px}.tab{border:0;background:transparent;padding:11px 8px;border-radius:12px;color:var(--muted);font-weight:700;font-size:15px}.tab.active{background:var(--panel);color:var(--accent);box-shadow:0 2px 10px rgba(29,73,62,.09)}
    .view{display:none}.view.active{display:block}.panel{background:var(--panel);border:1px solid rgba(219,231,227,.85);border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:var(--shadow)}h2{font-size:19px;margin:0 0 16px}h3{font-size:15px;margin:20px 0 10px;color:var(--accent)}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.full{grid-column:1/-1}label{display:block;font-size:13px;color:var(--muted);font-weight:650;margin:0 0 5px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:#fbfdfc;color:var(--ink);padding:11px 12px;font:inherit;min-height:44px}textarea{min-height:82px;resize:vertical}input:focus,select:focus,textarea:focus{outline:3px solid rgba(25,116,95,.15);border-color:var(--accent)}
    .scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.scale input{position:absolute;opacity:0;pointer-events:none}.scale label{margin:0;border:1px solid var(--line);border-radius:11px;text-align:center;padding:10px 3px;color:var(--muted);cursor:pointer;background:#fbfdfc}.scale input:checked+label{background:var(--accent);color:#fff;border-color:var(--accent)}
    .actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}button,.file-label{appearance:none;border:0;border-radius:12px;padding:11px 15px;min-height:44px;font:inherit;font-weight:700;cursor:pointer;background:var(--accent);color:#fff}.secondary{background:var(--accent2);color:var(--accent)}.danger{background:#fae8e8;color:var(--warn)}.file-label input{display:none}
    .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:#f4f9f7;padding:14px;border-radius:15px}.metric strong{display:block;font-size:24px}.metric span{font-size:12px;color:var(--muted)}
    .weekbar{height:9px;background:#e8efec;border-radius:20px;overflow:hidden;margin:7px 0 14px}.weekbar i{display:block;height:100%;background:var(--accent);border-radius:inherit;max-width:100%}.empty{text-align:center;padding:28px 10px;color:var(--muted)}
    .entry{border-top:1px solid var(--line);padding:15px 0}.entry:first-of-type{border-top:0}.entry-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.entry-date{font-weight:800}.badges{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.badge{font-size:12px;background:var(--accent2);color:var(--accent);padding:4px 8px;border-radius:99px}.entry-note{white-space:pre-wrap;color:#3d5751;font-size:14px}.mini{padding:6px 9px;min-height:34px;font-size:12px}.hint{font-size:12px;color:var(--muted);margin:10px 0 0}.status{min-height:24px;margin-top:10px;font-size:13px;color:var(--accent);font-weight:700}
    @media(max-width:620px){.app{padding:14px 10px 45px}header{align-items:flex-start;flex-direction:column}.panel{padding:16px;border-radius:17px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.metrics{grid-template-columns:repeat(2,1fr)}.tab{font-size:14px;padding-inline:4px}}
    @media(prefers-color-scheme:dark){:root{--bg:#101916;--panel:#18231f;--ink:#ebf4f0;--muted:#a3b7af;--line:#31443d;--accent:#64c6aa;--accent2:#263d35;--warn:#ff9b9b;--shadow:none}body{background:linear-gradient(145deg,#101916,#17201d)}input,select,textarea,.scale label{background:#121c19}.tabs{background:#111a17}.tab.active{background:#21312b}.metric{background:#14201c}}
  </style>
</head>
<body>
<main class="app">
  <header><div><h1>My Balance Log</h1><p class="tagline">学ぶ・動く・休むを、自分のペースで。</p></div><div id="streak" class="badge">記録 0日</div></header>
  <nav class="tabs" aria-label="画面切替">
    <button class="tab active" data-view="record">今日の記録</button>
    <button class="tab" data-view="summary">週間まとめ</button>
    <button class="tab" data-view="history">履歴</button>
  </nav>

  <section id="record" class="view active">
    <form id="logForm" class="panel">
      <h2>今日を記録する</h2>
      <input type="hidden" id="editId">
      <div class="grid">
        <div><label for="date">日付</label><input id="date" type="date" required></div>
        <div><label for="sleep">睡眠時間</label><input id="sleep" type="number" min="0" max="24" step="0.25" placeholder="例：7.5"></div>
        <div class="full"><label>今日の調子（1＝低い、5＝とても良い）</label><div class="scale" id="conditionScale"></div></div>
        <div class="full"><label>疲労度（1＝軽い、5＝かなり強い）</label><div class="scale" id="fatigueScale"></div></div>
      </div>
      <h3>学習</h3>
      <div class="grid">
        <div><label for="toeic">TOEIC・英語（分）</label><input id="toeic" type="number" min="0" step="5" placeholder="0"></div>
        <div><label for="stats">統計・数学（分）</label><input id="stats" type="number" min="0" step="5" placeholder="0"></div>
        <div><label for="otherStudy">その他の学習（分）</label><input id="otherStudy" type="number" min="0" step="5" placeholder="0"></div>
        <div><label for="studyTopic">今日やったこと</label><input id="studyTopic" placeholder="例：Part 5、標準偏差"></div>
      </div>
      <h3>身体</h3>
      <div class="grid">
        <div><label for="training">運動・トレーニング（分）</label><input id="training" type="number" min="0" step="5" placeholder="0"></div>
        <div><label for="trainingType">内容</label><input id="trainingType" placeholder="例：筋トレ、ランニング、休養"></div>
        <div><label for="steps">歩数（任意）</label><input id="steps" type="number" min="0" step="100" placeholder="0"></div>
        <div><label for="mood">気分</label><select id="mood"><option value="">選択しない</option><option>😊 良い</option><option>🙂 まあまあ</option><option>😐 普通</option><option>😮‍💨 疲れ気味</option><option>😢 つらい</option></select></div>
        <div class="full"><label for="note">ひとこと・振り返り</label><textarea id="note" placeholder="できたこと、体調、明日意識したいことなど"></textarea></div>
      </div>
      <div class="actions"><button type="submit" id="saveBtn">記録を保存</button><button type="button" id="cancelEdit" class="secondary" hidden>編集をやめる</button></div>
      <div id="status" class="status" aria-live="polite"></div>
    </form>
  </section>

  <section id="summary" class="view">
    <div class="panel"><h2>直近7日間</h2><div class="metrics" id="metrics"></div></div>
    <div class="panel"><h2>今週のバランス</h2><div id="bars"></div><p class="hint">目安は競争ではなく、自分のペースを見つけるためのものです。</p></div>
  </section>

  <section id="history" class="view">
    <div class="panel"><div class="entry-head"><h2>これまでの記録</h2><span id="count" class="hint"></span></div><div id="entries"></div></div>
    <div class="panel"><h2>バックアップ</h2><p class="hint">端末やブラウザを変更する前にJSONを書き出してください。</p><div class="actions"><button type="button" id="exportJson" class="secondary">JSONを書き出す</button><button type="button" id="exportCsv" class="secondary">CSVを書き出す</button><label class="file-label secondary">JSONを読み込む<input id="importJson" type="file" accept="application/json"></label></div></div>
  </section>
</main>
<script>
  const KEY='myBalanceLog.v1';
  let logs=JSON.parse(localStorage.getItem(KEY)||'[]');
  const $=id=>document.getElementById(id);
  const num=id=>Number($(id).value)||0;
  function makeScale(root,name){for(let i=1;i<=5;i++){root.insertAdjacentHTML('beforeend',`<input type="radio" name="${name}" id="${name}${i}" value="${i}"><label for="${name}${i}">${i}</label>`)} }
  makeScale($('conditionScale'),'condition'); makeScale($('fatigueScale'),'fatigue');
  $('date').value=new Date().toISOString().slice(0,10);
  function save(){localStorage.setItem(KEY,JSON.stringify(logs));renderAll()}
  function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
  function selected(name){return Number(document.querySelector(`input[name="${name}"]:checked`)?.value)||0}
  function setSelected(name,value){document.querySelectorAll(`input[name="${name}"]`).forEach(x=>x.checked=Number(x.value)===Number(value))}
  function resetForm(){ $('logForm').reset();$('date').value=new Date().toISOString().slice(0,10);$('editId').value='';$('saveBtn').textContent='記録を保存';$('cancelEdit').hidden=true }
  $('logForm').addEventListener('submit',e=>{e.preventDefault();const item={id:$('editId').value||crypto.randomUUID(),date:$('date').value,sleep:num('sleep'),condition:selected('condition'),fatigue:selected('fatigue'),toeic:num('toeic'),stats:num('stats'),otherStudy:num('otherStudy'),studyTopic:$('studyTopic').value.trim(),training:num('training'),trainingType:$('trainingType').value.trim(),steps:num('steps'),mood:$('mood').value,note:$('note').value.trim(),updatedAt:new Date().toISOString()};const ix=logs.findIndex(x=>x.id===item.id);if(ix>=0)logs[ix]=item;else logs.push(item);save();resetForm();$('status').textContent='保存しました ✓';setTimeout(()=>$('status').textContent='',2200)});
  $('cancelEdit').onclick=resetForm;
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.view).classList.add('active');renderAll()});
  function recent(){const end=new Date();end.setHours(23,59,59,999);const start=new Date(end);start.setDate(end.getDate()-6);start.setHours(0,0,0,0);return logs.filter(x=>{const d=new Date(x.date+'T12:00:00');return d>=start&&d<=end})}
  function renderSummary(){const r=recent(),sum=k=>r.reduce((a,x)=>a+(Number(x[k])||0),0),avg=k=>{const v=r.map(x=>Number(x[k])).filter(Boolean);return v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1):'—'};const study=sum('toeic')+sum('stats')+sum('otherStudy');$('metrics').innerHTML=`<div class="metric"><strong>${Math.round(study/60*10)/10}h</strong><span>学習</span></div><div class="metric"><strong>${Math.round(sum('training')/60*10)/10}h</strong><span>運動</span></div><div class="metric"><strong>${avg('sleep')}h</strong><span>平均睡眠</span></div><div class="metric"><strong>${r.length}日</strong><span>記録</span></div>`;const specs=[['TOEIC・英語',sum('toeic'),300],['統計・数学',sum('stats'),120],['その他の学習',sum('otherStudy'),120],['運動',sum('training'),180]];$('bars').innerHTML=specs.map(([n,v,t])=>`<div><div class="entry-head"><span>${n}</span><strong>${v}分</strong></div><div class="weekbar"><i style="width:${Math.min(100,v/t*100)}%"></i></div></div>`).join('')}
  function renderEntries(){$('count').textContent=`${logs.length}件`;$('entries').innerHTML=logs.length?'':`<div class="empty">まだ記録がありません。</div>`;[...logs].sort((a,b)=>b.date.localeCompare(a.date)||b.updatedAt.localeCompare(a.updatedAt)).forEach(x=>{const study=(x.toeic||0)+(x.stats||0)+(x.otherStudy||0);$('entries').insertAdjacentHTML('beforeend',`<article class="entry"><div class="entry-head"><span class="entry-date">${esc(x.date)}</span><div><button class="mini secondary" data-edit="${x.id}">編集</button> <button class="mini danger" data-delete="${x.id}">削除</button></div></div><div class="badges"><span class="badge">学習 ${study}分</span><span class="badge">運動 ${x.training||0}分</span>${x.sleep?`<span class="badge">睡眠 ${x.sleep}h</span>`:''}${x.condition?`<span class="badge">調子 ${x.condition}/5</span>`:''}${x.mood?`<span class="badge">${esc(x.mood)}</span>`:''}</div>${x.studyTopic?`<div class="entry-note">学習：${esc(x.studyTopic)}</div>`:''}${x.trainingType?`<div class="entry-note">身体：${esc(x.trainingType)}</div>`:''}${x.note?`<div class="entry-note">${esc(x.note)}</div>`:''}</article>`)});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('この記録を削除しますか？')){logs=logs.filter(x=>x.id!==b.dataset.delete);save()}});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit))}
  function edit(id){const x=logs.find(v=>v.id===id);if(!x)return;Object.keys(x).forEach(k=>{if($(k)&&!['condition','fatigue'].includes(k))$(k).value=x[k]??''});setSelected('condition',x.condition);setSelected('fatigue',x.fatigue);$('editId').value=x.id;$('saveBtn').textContent='変更を保存';$('cancelEdit').hidden=false;document.querySelector('[data-view="record"]').click();scrollTo({top:0,behavior:'smooth'})}
  function renderStreak(){const ds=[...new Set(logs.map(x=>x.date))].sort().reverse();let n=0,d=new Date();for(let i=0;i<366;i++){const s=d.toISOString().slice(0,10);if(ds.includes(s)){n++;d.setDate(d.getDate()-1)}else if(i===0){d.setDate(d.getDate()-1)}else break}$('streak').textContent=`連続記録 ${n}日`}
  function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
  $('exportJson').onclick=()=>download('my-balance-log.json',JSON.stringify(logs,null,2),'application/json');
  $('exportCsv').onclick=()=>{const keys=['date','sleep','condition','fatigue','toeic','stats','otherStudy','studyTopic','training','trainingType','steps','mood','note'];const q=v=>'"'+String(v??'').replaceAll('"','""')+'"';download('my-balance-log.csv','\ufeff'+[keys.join(','),...logs.map(x=>keys.map(k=>q(x[k])).join(','))].join('\n'),'text/csv;charset=utf-8')};
  $('importJson').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data))throw 0;if(confirm(`${data.length}件を読み込み、現在の記録に追加しますか？`)){const map=new Map(logs.map(x=>[x.id,x]));data.forEach(x=>map.set(x.id||crypto.randomUUID(),x));logs=[...map.values()];save()}}catch{$('status').textContent='読み込めないファイルです。'}e.target.value=''};
  function renderAll(){renderSummary();renderEntries();renderStreak()}renderAll();
</script>
</body>
</html>
